# Commit-message prefixes follow Conventional Commits (checked by .github/workflows/conventions.yml).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      commitlint:
        patterns: ["*"]
