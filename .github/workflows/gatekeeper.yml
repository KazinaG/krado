name: Gatekeeper

# What a user sees on first launch after downloading the DMG in a browser.
# - After every Release workflow run (draft releases and dry runs): checks the DMG it built,
#   before anything is published.
# - When a release is published, on pushes of this check, or by hand: downloads the public
#   DMG without signing in, exactly like a browser does.
# GATEKEEPER_EXPECTED is "rejected" while releases are self-signed and not notarized.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/workflows/gatekeeper.yml
      - scripts/check-gatekeeper.sh
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check (empty = latest published release)
        required: false

permissions:
  contents: read

env:
  GATEKEEPER_EXPECTED: rejected

jobs:
  built-dmg:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '{release,dryrun}'
          path: built
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check first launch
        run: scripts/check-gatekeeper.sh "$(ls built/krado-*.dmg | head -1)" "$GATEKEEPER_EXPECTED"

  public-dmg:
    if: github.event_name != 'workflow_run'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download the public DMG (no sign-in)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/krado-${TAG#v}.dmg"
          echo "$url"
          curl -fsSL -o "krado-${TAG#v}.dmg" "$url"
          echo "DMG=krado-${TAG#v}.dmg" >> "$GITHUB_ENV"
      - name: Check first launch
        run: scripts/check-gatekeeper.sh "$DMG" "$GATEKEEPER_EXPECTED"
