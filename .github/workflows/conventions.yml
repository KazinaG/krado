# コミット・枝の名前・タグの決まりを確かめる（4つのリポジトリで同じファイル）。
#   コミット: Conventional Commits 1.0.0 を commitlint（@commitlint/config-conventional）で。PR の枝の中のすべてのコミットの件名も
#     PR タイトルと同じく英語（日本語はバッククォートの中だけ。.github/commitlint/commitlint.config.mjs）。本文は自由
#   枝: Conventional Branch の目的別の頭だけ（main と dependabot/ は対象外）
#   タグ: SemVer 2.0.0、v なし（例 1.2.3）。公開済みの v 付きタグはそのまま残す
#   PR タイトル: 文は英語。日本語などの名前はバッククォートの中だけ（例 feat: add `出勤簿` export）
#   お試しの後の混ざり: PR 本文に `trial: <full sha>`（Kazinaさんが試した commit）があり、その commit から head までの差に
#     文書（docs/**・*.md）と CI の設定（.github/**）以外のファイルが1つでもあれば落とす。本文に `trial-recheck: <今の head の full sha>`
#     （Kazinaさんがもう一度試したあと CoS 経由の OK でボットが書く）があれば通す。trial の行が無い PR はそのまま通る（10/27 Kazinaさん A）
#   sandustry-ai-mod だけ: 同じジョブの中で構文の確かめと 107 件のテスト（1.5 秒ほど）も回す
# 決まりはこのファイルの中身そのもの。
# 枝の push では回さない。PR（draft を含む）で1つのジョブ「conventions」が1回だけ見る（4つのリポ共通の決まりの③）。
# push で回るのはタグだけ。
name: conventions

on:
  push:
    tags: ['**']
  pull_request:
    # edited: タイトルや本文（trial・trial-recheck の行）を直すとやり直す。ready_for_review: ready にした時の本文でも見る
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: conventions-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # PR では枝の名前・コミット・タイトルをこの1つのジョブで見る（必須チェック名は conventions）。
    # edited（タイトルや本文の直し）でも回す。ジョブを skip すると skipped＝成功が前の失敗を上書きするため。
    name: conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main からの全コミットを読むため（浅い clone では範囲が欠ける）
          persist-credentials: false

      - name: 枝の名前（Conventional Branch）
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'dependabot/')
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # https://conventionalbranch.org/v1.1.0/spec.json の grammar.regex から、目的別の頭だけを残したもの
          re='^(feature|feat|bugfix|fix|hotfix|release|chore)/[a-z0-9]+(\.[a-z0-9]+)*(-[a-z0-9]+(\.[a-z0-9]+)*)*$'
          if [[ ! "$BRANCH" =~ $re ]]; then
            echo "::error::枝の名前「$BRANCH」は決まりに合いません。feat/・fix/・chore/ など目的別の頭＋小文字・数字・ハイフンで（例 fix/header-bug）。codex/ などの頭は使いません。"
            exit 1
          fi
          echo "枝の名前 OK: $BRANCH"

      - name: タグ（SemVer 2.0.0、v なし）
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # https://semver.org/spec/v2.0.0.html の推奨正規表現（\d を [0-9] に、(?: を ( に直しただけ）
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::タグ「$TAG」は SemVer 2.0.0 の v なしの形ではありません（例 1.2.3）。"
            exit 1
          fi
          # Chrome 拡張の manifest がある場合: version は数字と点だけなので、プレリリース・ビルド情報は使えない。
          # https://developer.chrome.com/docs/extensions/reference/manifest/version
          manifest=$(git ls-files -z '*manifest*.json' | xargs -0 -r grep -l '"manifest_version"' | head -1)
          if [ -n "$manifest" ]; then
            [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Chrome 拡張のタグは数字3つだけ（例 1.2.3）。-beta.1 などは使えません。"; exit 1; }
            version=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).version' "$manifest")
            [ "$TAG" = "$version" ] || { echo "::error::タグ $TAG と $manifest の version $version が違います。"; exit 1; }
          fi
          echo "タグ OK: $TAG"

      - name: PR タイトルの言語（文は英語、日本語はバッククォートの中だけ）
        if: github.event_name == 'pull_request'
        env:
          # タイトルは環境変数で渡し、スクリプトの中に式を書かない（スクリプト注入を防ぐ。
          # https://docs.github.com/en/actions/reference/security/secure-use の「intermediate environment variable」）
          TITLE: ${{ github.event.pull_request.title }}
          PYTHONUTF8: '1'
        shell: python
        run: |
          # バッククォート（`）で囲んだ部分を除き、残りに ASCII 以外の文字があれば落とす。
          # 例: 「feat: add `出勤簿` export」は通り、「feat: 出勤簿を追加」は止まる。
          # 閉じていないバッククォートは囲みとみなさず、安全側に倒して落とす。
          # タイトルそのものはログに出さない（::から始まるワークフローコマンドとして読まれないように）。
          import os, sys
          title = os.environ["TITLE"]
          how = ("直し方: 文は英語で書く。日本語の名前は `出勤簿` のようにバッククォートで囲む"
                 "（例 feat: add `出勤簿` export）。PR のタイトルを直すと、このチェックは自動でやり直される。")
          if title.count("`") % 2:
              print("::error::PR タイトルのバッククォート（`）が閉じていません。" + how)
              sys.exit(1)
          bad = list(dict.fromkeys(c for c in "".join(title.split("`")[0::2]) if ord(c) > 0x7F))
          if bad:
              shown = "、".join(f"「{c}」(U+{ord(c):04X})" for c in bad[:20]) + (f" ほか{len(bad) - 20}種" if len(bad) > 20 else "")
              print(f"::error::PR タイトルのバッククォートの外に英語以外の文字があります: {shown}。" + how)
              sys.exit(1)
          print("PR タイトルの言語 OK（バッククォートの外は ASCII だけ）")

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.ref_type != 'tag'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .github/commitlint/package-lock.json

      - name: commitlint を入れる
        if: github.ref_type != 'tag'
        run: npm ci --prefix .github/commitlint --no-fund --no-audit

      - name: コミット（Conventional Commits 1.0.0）
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PR の head が main から分かれた後のコミットすべて（PR のコミット範囲と同じ）。
          # merge・revert・fixup! などは commitlint の既定で対象外。
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          .github/commitlint/node_modules/.bin/commitlint --config .github/commitlint/commitlint.config.mjs \
            --from "$base" --to "$HEAD_SHA" --verbose

      - name: PR タイトル（squash マージで main に入る件名）
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" | .github/commitlint/node_modules/.bin/commitlint \
            --config .github/commitlint/commitlint.config.mjs --verbose

      - name: テスト（sandustry-ai-mod だけ。PR の試しマージの中身で）
        if: github.event_name == 'pull_request' && github.repository == 'KazinaG/sandustry-ai-mod'
        run: npm run check && npm test

      - name: お試しの後の混ざり（trial の commit から head までの差）
        if: github.event_name == 'pull_request'
        env:
          # 本文は環境変数で渡し、スクリプトの中に式を書かない（スクリプト注入を防ぐ）。本文そのものはログに出さない。
          BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PYTHONUTF8: '1'
        shell: python
        run: |
          # 決まり（rule.md 9章5、10/26 21:19 と 10/27 0:00 Kazinaさん A）: お試しの後に混ざった分に、文書・CI の設定以外の
          # ファイルが1つでもあれば Kazinaさんがもう一度試す。どのファイルが関係あるかはボットが選ばない。
          # 注意: 「Re-run」は最初のイベントの本文を使う。本文を直したら edited のやり直しを待つ。
          import os, re, subprocess, sys
          body = (os.environ.get("BODY") or "").replace("\r\n", "\n")
          head = os.environ["HEAD_SHA"]
          def lines(key):
              return re.findall(rf"^[ \t]*{key}:[ \t]*(\S*)[ \t]*$", body, flags=re.MULTILINE | re.IGNORECASE)
          trials = lines("trial")
          if not trials:
              print("trial の行が無い（お試しに出していない）ので見ない / No trial line: nothing to check.")
              sys.exit(0)
          trial = trials[-1].lower()  # 複数あれば最後の行（いちばん新しいお試し）
          if not re.fullmatch(r"[0-9a-f]{40}", trial):
              print("::error::trial の行は 40 文字の commit SHA にしてください（例 trial: 0123…）。"
                    " / The trial line must be a full 40-character commit SHA.")
              sys.exit(1)
          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True)
          if git("cat-file", "-e", f"{trial}^{{commit}}").returncode != 0:
              print(f"::error::trial の commit {trial[:12]} がこのリポジトリに見つかりません。安全のため止めます。"
                    f" / Trial commit {trial[:12]} is not in this repository; failing closed.")
              sys.exit(1)
          if git("merge-base", "--is-ancestor", trial, head).returncode != 0:
              print(f"::error::trial の commit {trial[:12]} は head {head[:12]} の祖先ではありません（枝を作り直した？）。安全のため止めます。"
                    f" / Trial commit {trial[:12]} is not an ancestor of head {head[:12]}; failing closed.")
              sys.exit(1)
          diff = git("diff", "--name-only", "-z", trial, head)
          if diff.returncode != 0:
              print("::error::trial から head までの差を読めませんでした。 / Could not diff trial..head.")
              sys.exit(1)
          files = [f for f in diff.stdout.split("\0") if f]
          def free(f):  # 文書と CI の設定
              return f.startswith("docs/") or f.startswith(".github/") or f.lower().endswith(".md")
          others = [f for f in files if not free(f)]
          print(f"trial {trial[:12]} → head {head[:12]}: 変わったファイル {len(files)} 件、文書・CI 以外 {len(others)} 件")
          if not others:
              print("お試しの後の差は文書・CI の設定だけなので通す / Only docs and CI config changed since the trial.")
              sys.exit(0)
          rechecks = [r.lower() for r in lines("trial-recheck")]
          if head in rechecks:
              print(f"trial-recheck が今の head {head[:12]} を指しているので通す（Kazinaさんがもう一度試した）"
                    f" / trial-recheck matches head {head[:12]}.")
              sys.exit(0)
          print("お試しの後に混ざった、文書・CI の設定以外のファイル / Files changed since the trial (not docs or CI config):")
          for f in others[:50]:
              print("  - " + f.encode("unicode_escape").decode("ascii"))
          if len(others) > 50:
              print(f"  …ほか {len(others) - 50} 件 / and {len(others) - 50} more")
          print(f"::error::お試しの後に文書・CI の設定以外のファイルが {len(others)} 件変わりました（上の一覧）。Kazinaさんにもう一度試してもらい、"
                f"CoS 経由の OK のあと本文に「trial-recheck: {head}」を書いてください。"
                f" / {len(others)} non-doc file(s) changed since the trial (listed above). Kazina must re-check the trial;"
                f" after her OK via CoS, add \"trial-recheck: {head}\" to the PR body.")
          sys.exit(1)
