name: Login toggle regression

on:
  push:
    branches: [codex/login-toggle-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-toggle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv "$RUNNER_TEMP/login-toggle-venv"
      - run: '"$RUNNER_TEMP/login-toggle-venv/bin/pip" install Pillow'
      - name: Click login row and compare settled badge
        run: |
          export PATH="$RUNNER_TEMP/login-toggle-venv/bin:$PATH"
          bash scripts/login-toggle.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: login-toggle-${{ matrix.os }}
          path: login-toggle/
          if-no-files-found: error
