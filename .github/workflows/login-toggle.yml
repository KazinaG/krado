name: Login toggle regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-toggle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m venv "$RUNNER_TEMP/login-toggle-venv"
      - run: '"$RUNNER_TEMP/login-toggle-venv/bin/pip" install Pillow'
      - name: Click login row and compare settled badge
        run: |
          export PATH="$RUNNER_TEMP/login-toggle-venv/bin:$PATH"
          bash scripts/login-toggle.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: login-toggle-${{ matrix.os }}
          path: login-toggle/
          if-no-files-found: error
