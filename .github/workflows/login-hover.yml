name: Login row hover

# Real menu, real pointer: the Launch at Login row must lose its highlight when the
# pointer or keyboard moves on, retain highlight after a click, and show the On/Off state as a word.
# Pull requests that are ready for review only (skipped while draft), not branch pushes or main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs when a new push arrives on the same pull request.
concurrency:
  group: login-hover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A missing diff must run the check, never silently bypass it.
          relevant=true
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            if git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/login-hover-paths"; then
              relevant=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  Sources/Krado/LoginRowView.swift|Sources/Krado/App.swift|Sources/KradoCore/LoginRow*.swift|scripts/login-hover*|scripts/check-login-hover.py|.github/workflows/login-hover.yml)
                    relevant=true ;;
                esac
              done < "$RUNNER_TEMP/login-hover-paths"
            fi
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  login-hover:
    needs: changes
    if: needs.changes.outputs.relevant == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet Pillow
      - name: Move the pointer over the real menu and judge the screenshots
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          bash scripts/login-hover.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: login-hover-${{ matrix.os }}
          path: login-hover/
          if-no-files-found: error

  result:
    name: Login row hover result
    if: always()
    needs: [changes, login-hover]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          HOVER: ${{ needs.login-hover.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          [ "$CHANGES" = success ] || exit 1
          if [ "$HOVER" = success ]; then
            exit 0
          fi
          [ "$HOVER" = skipped ] && { [ "$RELEVANT" != true ] || [ "$DRAFT" = true ]; }
