name: Login row hover

# Real menu, real pointer: the Launch at Login row must lose its highlight when the
# pointer or keyboard moves on, retain highlight after a click, and show contrasting state marks.
on:
  push:
    paths:
      - Sources/Krado/LoginRowView.swift
      - Sources/Krado/App.swift
      - Sources/KradoCore/LoginBadge*.swift
      - Sources/KradoCore/LoginRow*.swift
      - scripts/login-hover*
      - scripts/check-login-hover.py
      - .github/workflows/login-hover.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-hover:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet Pillow
      - name: Move the pointer over the real menu and judge the screenshots
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          bash scripts/login-hover.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: login-hover-${{ matrix.os }}
          path: login-hover/
          if-no-files-found: error
