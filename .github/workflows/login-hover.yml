name: Login row hover

# Real menu, real pointer: the Launch at Login row must lose its highlight when the
# pointer or keyboard moves on, retain highlight after a click, and show the On/Off state as a word.
# Pull requests that are ready for review only (skipped while draft), not branch pushes or main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Sources/Krado/LoginRowView.swift
      - Sources/Krado/App.swift
      - Sources/KradoCore/LoginRow*.swift
      - scripts/login-hover*
      - scripts/check-login-hover.py
      - .github/workflows/login-hover.yml
  workflow_dispatch:

permissions:
  contents: read

# Cancel older runs when a new push arrives on the same pull request.
concurrency:
  group: login-hover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login-hover:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet Pillow
      - name: Move the pointer over the real menu and judge the screenshots
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          bash scripts/login-hover.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: login-hover-${{ matrix.os }}
          path: login-hover/
          if-no-files-found: error
