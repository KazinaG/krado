name: Menu screenshots

on:
  push:
    branches: [codex/next-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Capture Japanese menus
        run: bash scripts/menu-shots.sh '${{ matrix.os }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: menu-shots-${{ matrix.os }}
          path: menu-shots/
          if-no-files-found: error
