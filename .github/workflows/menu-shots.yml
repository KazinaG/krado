name: Menu screenshots

on:
  push:
    branches: [codex/next-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Capture Japanese menus
        run: bash scripts/menu-shots.sh '${{ matrix.os }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: menu-shots-${{ matrix.os }}
          path: menu-shots/
          if-no-files-found: error
