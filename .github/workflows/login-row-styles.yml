name: Login row styles

# Evidence only (no pass/fail): the real Launch at Login row for each Off style
# (A outline, B faint fill, C outline + faint fill) and On, Light and Dark,
# resting and highlighted, on macOS 26. Runs only on the branch that compares them.
on:
  push:
    branches: [codex/login-row-1026]
    paths:
      - Sources/Krado/LoginRowView.swift
      - Sources/KradoCore/LoginRow*.swift
      - scripts/login-row-styles.sh
      - .github/workflows/login-row-styles.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: login-row-styles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  styles:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Screenshot each style in the real menu
        run: bash scripts/login-row-styles.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: login-row-styles-macos-26
          path: login-row-styles/
          if-no-files-found: error
          retention-days: 7
