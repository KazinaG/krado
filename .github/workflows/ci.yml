name: CI

# 文書だけの変更（docs/・README・AGENTS.md・CONTRIBUTING.md・LICENSE）では走らない。
# CHANGELOG*.md は changelog ジョブが確かめるので除外しない。タグの push には paths は効かない。
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.ja.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.ja.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE'

permissions:
  contents: read

# 同じブランチに新しい push が来たら古い実行を止める。main は止めずに全部最後まで走らせる。
concurrency:
  # main は実行ごとに別グループ（待ち行列でも止まらない）。
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-changelog-headings.sh

  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --disable-keychain
      - run: swift build --disable-keychain
      - run: swift build --disable-keychain -Xswiftc -DKRADO_LOGIN_SWITCH_PROBE -Xswiftc -DKRADO_CI_HOOKS
      - run: swift build --disable-keychain -Xswiftc -DKRADO_LAB_HOOKS
