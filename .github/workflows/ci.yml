name: CI

# Runs on every pull request, drafts included (the Mac cannot be checked on the Linux box, so
# drafts get the fast tests and builds here), and on documentation-only changes too: the main
# ruleset requires this workflow's changelog and tests checks, so path filters would block them.
# Not on branch pushes or on main: main requires branches to be up to date (strict), so what lands
# on main is exactly the tree these checks passed on (shared CI rule, Kazina 2026-10-26).
on:
  pull_request:

permissions:
  contents: read

# Cancel older runs when a new push arrives on the same pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-changelog-headings.sh

  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test --disable-keychain
      - run: swift build --disable-keychain
      - run: swift build --disable-keychain -Xswiftc -DKRADO_LOGIN_SWITCH_PROBE -Xswiftc -DKRADO_CI_HOOKS
      - run: swift build --disable-keychain -Xswiftc -DKRADO_LAB_HOOKS
