name: CI

# Run on every change, including documentation-only changes. The main ruleset requires
# this workflow's changelog and tests checks, so path filters would block documentation-only commits from main.
on:
  push:
  pull_request:

permissions:
  contents: read

# Cancel older runs when a new push arrives on the same branch. Let every main run finish.
concurrency:
  # Give each main run its own group so queued runs are not canceled either.
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/check-changelog-headings.sh

  tests:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/module-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test --disable-keychain
      - run: swift build --disable-keychain
      - run: swift build --disable-keychain -Xswiftc -DKRADO_LOGIN_SWITCH_PROBE -Xswiftc -DKRADO_CI_HOOKS
      - run: swift build --disable-keychain -Xswiftc -DKRADO_LAB_HOOKS
