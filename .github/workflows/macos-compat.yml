name: macOS compatibility

# Weekly build + test on the newest macOS runner images, to catch OS/toolchain breakage early.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest currently uses the same image as macos-26 (arm64). Avoid running it twice.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/module-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sw_vers && swift --version
      - run: swift test --disable-keychain
      - run: swift build --disable-keychain
